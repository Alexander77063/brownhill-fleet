# .github/workflows/unit-tests.yml
#
# Fast, runnable-on-anything CI: install deps, typecheck, run vitest.
# Always green if the repo typechecks and the unit suite passes.
# The hosted stack's smoke is in hosted-smoke.yml, which runs on
# ubuntu-latest too; its production-shaped job needs the self-hosted
# `pulsar` runner and is opt-in.
#
# It also runs the repository's no-credential gate, because that gate is
# about the repository and not about the deployment: it has to run on every
# pull request, including the ones that touch nothing under hosted/.

name: unit-tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel duplicates on the same PR / branch — a fast re-push shouldn't
# queue two 90-second unit runs behind each other.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JWT_SHARED_SECRET: ci-jwt-secret-for-matrices-only-do-not-reuse
      BOOTSTRAP_TOKEN: ci-bootstrap-token-do-not-reuse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # pnpm version comes from packageManager in package.json — don't pass
      # `version:` here or pnpm complains about "Multiple versions of pnpm
      # specified" (ERR_PNPM_BAD_PM_VERSION) and exits before the test step.
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: No credential in the tree
        # This repository is PUBLIC, and it has already published two
        # credentials in plain text: the box's database superuser password,
        # and the customer's own login password. Both were tracked files.
        #
        # Deleting the lines removed them from the checkout, not from the
        # history — so the other half of that fix is ROTATION on the box,
        # which the handover says how to do. This gate is the half that
        # lives in the repository: it makes sure the NEXT one does not
        # happen, and it runs on every pull request because a credential can
        # land in any file at all.
        run: bash hosted/tests/no-committed-credentials.sh
      - name: The no-credential gate can fail
        # A gate that cannot fail is not a gate. This runs it against a tree
        # that really does hold a value of the hunted shape, and requires it
        # to fail on the right rule.
        #
        # It earns its place. The first version of this gate passed every
        # tree in the repository, including the ones it was written for: a
        # greedy regular expression stripped the hit it had found, so the
        # rule reported "no fallback" on a file that had one in plain text.
        # The gate looked green for as long as it existed.
        run: bash hosted/tests/no-committed-credentials-negative.sh
      - name: The acceptance bar's own arithmetic
        # hosted/tests/acceptance.sh decides whether a deployment is fit to
        # hand over, and that decision is arithmetic. The arithmetic asked
        # "did the accounting gate pass?" instead of "how many gates ran?", so
        # a deployment whose accounting smoke FAILED dropped back to the
        # five-gate bar and was reported as five of five — met.
        #
        # This runs the real acceptance script against stubbed gates and
        # holds the counting to its promise.
        run: bash hosted/tests/acceptance-arithmetic.sh
