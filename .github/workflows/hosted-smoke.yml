# .github/workflows/hosted-smoke.yml
#
# Hosted stack smoke — spins up Postgres + PostgREST via docker compose,
# applies every migration, runs the integration / portability / migrations-
# regression / hosted-smoke shell suites. Requires a runner with Docker
# AND a Pulsar-shaped environment (Postgres reachable, PostgREST image,
# the supabase shim), so it's pinned to `runs-on: [self-hosted, pulsar]`
# — the standard `ubuntu-latest` GH runner cannot satisfy these. The
# unit-tests workflow runs everywhere and gives a fast signal; this one
# is the real one when you can run it.

name: hosted-smoke

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'standalone/sql/**'
      - 'hosted/**'
      - 'package.json'
      - '.github/workflows/hosted-smoke.yml'
  workflow_dispatch:

concurrency:
  group: hosted-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hosted-smoke:
    runs-on: [self-hosted, pulsar]
    timeout-minutes: 30
    env:
      JWT_SHARED_SECRET: ci-jwt-secret-for-matrices-only-do-not-reuse
      BOOTSTRAP_TOKEN: ci-bootstrap-token-do-not-reuse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Spin up hosted stack
        run: docker compose -f hosted/dev/docker-compose.yml up -d
      - name: Wait for hosted Postgres to accept queries
        run: |
          for _ in $(seq 1 30); do
            docker exec -u postgres $(docker compose -f hosted/dev/docker-compose.yml ps -q postgres) psql -c 'SELECT 1' && break
            sleep 1
          done
      - name: Apply hosted schema + shim
        run: |
          PG=$(docker compose -f hosted/dev/docker-compose.yml ps -q postgres)
          docker exec -u postgres "$PG" psql -v ON_ERROR_STOP=1 -f /dev/stdin < standalone/sql/0000_supabase_shim.sql
          for f in $(ls -1 supabase/migrations/*.sql | sort); do
            docker exec -u postgres "$PG" psql -v ON_ERROR_STOP=1 -f /dev/stdin < "$f"
          done
      - name: Run hosted integration tests (DEPLOYMENT_PROFILE=hosted)
        run: DEPLOYMENT_PROFILE=hosted pnpm --filter @brownhill/webapp test
      - name: Hosted portability proof (assertions 0–17)
        run: bash hosted/tests/verify-hosted-portability.sh
      - name: Migrations-regression
        run: bash hosted/tests/migrations-regression.sh
      - name: Hosted smoke
        run: bash hosted/tests/smoke/hosted-smoke.sh
      - name: Tear down
        if: always()
        run: docker compose -f hosted/dev/docker-compose.yml down