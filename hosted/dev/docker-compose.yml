# hosted/dev/docker-compose.yml — local/CI stack for the hosted profile.
# Brings up postgres:16, postgrest:12, the Next app under DEPLOYMENT_PROFILE=hosted,
# and nginx with the self-signed cert under hosted/dev/certs/.
# Production uses systemd on a Namecheap Pulsar VM; this is for the CI matrix and
# for local smoke runs only.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    # Published so a host-run process — the app under `pnpm dev`, psql, a test
    # harness — can reach it. Inside the compose network the service name is
    # enough, but nothing outside can reach it otherwise, and the whole point
    # of this stack is that a person or a test can talk to it.
    ports: ["55432:5432"]
    healthcheck:
      # Over TCP, not over the unix socket.
      #
      # The postgres image starts a TEMPORARY server to run initdb and the
      # init scripts, and that server is started with `listen_addresses=''`
      # — it listens on the socket and on nothing else. A socket probe
      # therefore reports this database HEALTHY while it is still being
      # initialised, and everything that waits on `service_healthy` (the
      # bootstrap, postgrest and the app) starts against a database that is
      # about to be shut down and restarted underneath it. The failure then
      # lands on whichever step happened to run next.
      #
      # It cost ONE red build in this repository's CI history: 2026-11-03, at
      # the seed gate — and the defect sat in FIVE places, four of which had
      # not fired yet and were live in the customer's own box, where there is
      # no CI to re-run.
      #
      # The real server is the first one to listen on 127.0.0.1, so asking
      # for it over TCP cannot be fooled. The rule lives in
      # scripts/lib/postgres-container.sh, and
      # hosted/tests/postgres-readiness-probe.sh holds every gate to it.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -c 'SELECT 1' -U postgres"]
      interval: 5s
      retries: 30

  postgrest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgresql://postgres@postgres:5432/postgres
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_PRE_REQUEST: auth.pre_request
      # AT LEAST 32 BYTES. PostgREST v12 refuses to verify a session token
      # signed with a shorter secret, and it says so in the least helpful way
      # it can: every signed-in user gets `JWSError JWSInvalidSignature` from
      # PostgREST, which the application turns into "User is not a member of
      # any tenant" — as though the user had no membership, rather than as
      # though the secret were too short. The signature was perfectly valid.
      #
      # The default here was 31 bytes, one short of the limit, so the whole
      # local stack could not authenticate anybody and nothing said so: the
      # hosted smoke test only ever probes unauthenticated routes. The value
      # is the same one the CI workflow uses, so the two stacks cannot drift.
      PGRST_JWT_SECRET: ${JWT_SHARED_SECRET:-ci-jwt-secret-for-matrices-only-do-not-reuse}
    # The app's own origin rewrites /rest/v1 to this server, and the hosted
    # smoke test curls it directly. Both need it reachable from outside the
    # compose network.
    ports: ["55430:3000"]
    depends_on:
      # The schema has to exist BEFORE PostgREST starts, not merely before the
      # app does.
      #
      # PostgREST reads the database schema once, at start-up, and caches it.
      # A PostgREST that starts against an empty database has a cache with
      # nothing in it, and every WRITE through it then fails: an INSERT
      # answers 404 with an empty body, an RPC answers PGRST202, an embedded
      # relationship answers PGRST200. Reads keep working, because PostgREST
      # falls through to the database for a table it has never heard of —
      # which is exactly what makes this so easy to miss. The pages look
      # populated; the writes are quietly lost.
      #
      # The bootstrap oneshot below applies the shim and every migration and
      # exits, so this dependency waits for it to finish successfully and
      # PostgREST's first schema cache is the real schema. (The bootstrap also
      # sends `NOTIFY pgrst, 'reload schema'` when it finishes, which covers
      # the case this ordering cannot: a PostgREST that is already running
      # when a new migration is applied.)
      bootstrap: { condition: service_completed_successfully }

  # The stack provisions itself.
  #
  # This is the real bootstrap script — hosted/bootstrap/brownhill-bootstrap.sh
  # — not a copy of it. It applies the shim and every migration and creates
  # app_state, and it exits non-zero if any of that fails, so `next` does not
  # start against a half-built schema.
  #
  # Before this service existed the CI schema step applied the shim and the
  # migrations by hand and never created app_state — a table that no
  # migration creates, because it used to be created only by this same script
  # being run by hand on the production host. The app then failed every
  # request with 42P01 (relation "app_state" does not exist).
  #
  # The repository is mounted at /opt/brownhill because that is where it
  # lives on the production host, and the bootstrap script resolves its own
  # location relative to that.
  bootstrap:
    image: postgres:16
    volumes:
      - ../..:/opt/brownhill:ro
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
      BROWNHILL_REPO: /opt/brownhill
    entrypoint: ["/bin/sh", "-c", "bash /opt/brownhill/hosted/bootstrap/brownhill-bootstrap.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  next:
    build:
      context: ../..
      dockerfile: hosted/dev/Dockerfile.next
      args:
        # Baked into the bundle: the `/rest/v1` rewrite and the middleware's
        # drain check both resolve PostgREST's address when the app is built.
        POSTGREST_URL: http://postgrest:3000
    environment:
      DEPLOYMENT_PROFILE: hosted
      NODE_ENV: production
      PORT: 55431
      HOST: 0.0.0.0
      DATABASE_URL: postgres://postgres@postgres:5432/postgres
      # The same value, for the code paths that read it at run time.
      POSTGREST_URL: http://postgrest:3000
      # The per-install signing secret. The app accepts this name and
      # LOCAL_JWT_SECRET alike; PostgREST is configured with this one, so the
      # two must agree or PostgREST rejects every session the app mints.
      #
      # At least 32 bytes — see the note on PGRST_JWT_SECRET above for what a
      # shorter one does. It has to be the SAME value as PostgREST's.
      JWT_SHARED_SECRET: ${JWT_SHARED_SECRET:-ci-jwt-secret-for-matrices-only-do-not-reuse}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-ci-bootstrap-token}
      # The token the scheduled jobs present.
      #
      # This stack runs NODE_ENV=production, and `isCronAuthorized`
      # (src/lib/cron.ts) fails closed there: with CRON_SECRET unset, every
      # /api/cron/* call answers 401 — so the stack would pass every other
      # check and still bill nobody, because the rent invoice is raised by
      # /api/cron/generate-rent and nothing else.
      #
      # The value here is the DEVELOPMENT one, in the same spirit as the JWT
      # secret above it. The box generates its own at install time and keeps
      # it in /etc/brownhill/secrets/cron.env, which the app unit loads.
      CRON_SECRET: ${CRON_SECRET:-ci-cron-secret-for-matrices-only-do-not-reuse}
      BROWNHILL_FQDN: brownhill.localhost
      # The HMRC settings.
      #
      # They are here, empty, so the chaos drills can point the application
      # at a stub without editing a systemd unit or a compose file: the drill
      # recreates this service with HMRC_MTD_BASE_URL set, and recreates it
      # again without it to put it back.
      #
      # Empty means "not configured", which is exactly what the application
      # makes of an unset variable — so a plain stack behaves exactly as it
      # did before these lines existed.
      HMRC_MTD_CLIENT_ID: ${HMRC_MTD_CLIENT_ID:-}
      HMRC_MTD_CLIENT_SECRET: ${HMRC_MTD_CLIENT_SECRET:-}
      HMRC_MTD_REDIRECT_URI: ${HMRC_MTD_REDIRECT_URI:-}
      HMRC_MTD_BASE_URL: ${HMRC_MTD_BASE_URL:-}
      HMRC_MTD_VRN: ${HMRC_MTD_VRN:-}
      HMRC_ENV: ${HMRC_ENV:-sandbox}
    # Published so the app is reachable from the host: the hosted smoke test
    # curls http://127.0.0.1:55431, and a person driving the stack by hand
    # needs a URL too. Without this the smoke test skipped itself, silently,
    # and the job still went green.
    ports: ["55431:55431"]
    depends_on:
      postgres: { condition: service_healthy }
      postgrest: { condition: service_started }
      bootstrap: { condition: service_completed_successfully }

  nginx:
    image: nginx:1.27-alpine
    ports: ["443:443"]
    volumes:
      # The compose topology, not the production one — see the header of
      # nginx.dev.conf for why they are two files.
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./certs/server.crt:/etc/ssl/certs/server.crt:ro
      - ./certs/server.key:/etc/ssl/private/server.key:ro
    depends_on:
      next: { condition: service_started }

  # A stand-in for HMRC, for the chaos drills.
  #
  # The drills have to point the DEPLOYED application at an HMRC that answers
  # the way the drill needs it to. The application's submission path is the
  # thing under test, and it cannot be tested against the live HMRC API.
  #
  # It is on the compose network, so the application reaches it as
  # `stub-hmrc`, and it is published on the host, so the drill script can
  # drive the OAuth round trip itself. The mode is chosen by the drill, which
  # recreates this service with STUB_MODE set.
  #
  # The image is the same base the application is built from, so a stack that
  # has already built the application does not have to pull anything.
  stub-hmrc:
    image: node:22-bookworm-slim
    command: ["node", "/stub/stub-hmrc.mjs"]
    environment:
      STUB_MODE: ${STUB_MODE:-reject}
      STUB_PORT: "8099"
    volumes:
      # `../tests/chaos/lib`, NOT `./tests/chaos/lib`.
      #
      # A relative bind mount is resolved against the compose file's own
      # directory — `hosted/dev` — so `./tests/chaos/lib` pointed at
      # `hosted/dev/tests/chaos/lib`, which does not exist. Docker does not
      # complain about a missing host directory: it creates it, mounts the
      # empty directory, and the stub then dies on startup with
      # "Cannot find module '/stub/stub-hmrc.mjs'". The drill then reported
      # "the stub HMRC never came up", which was true but said nothing about
      # why. The stub lives at `hosted/tests/chaos/lib`, which is one level up.
      - ../tests/chaos/lib:/stub:ro
    ports: ["8099:8099"]
