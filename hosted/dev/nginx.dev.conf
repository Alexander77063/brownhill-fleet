# hosted/dev/nginx.dev.conf — nginx for the compose stack.
#
# NOT the production config. hosted/nginx/brownhill.conf is the one the
# production host runs, and it proxies to 127.0.0.1:55430 and
# 127.0.0.1:55431 — the ports PostgREST and Next listen on when they run
# natively on the Pulsar VM. In the compose stack they are separate
# containers with their own names, so that config points at the nginx
# container's own loopback and finds nothing there.
#
# It also includes /etc/letsencrypt/options-ssl-nginx.conf, which only
# exists on a host where certbot has written a certificate. The compose
# stack mounts a test certificate instead, so the include is dropped and
# the TLS settings are written out inline.
#
# The two configs therefore differ only in where they point and how they
# spell out the TLS options — the routing, the rate-limit zones and the
# headers are identical, so what CI proves about routing is what production
# does.

events { worker_connections 1024; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 30;

  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=bootstrap:10m rate=5r/m;

  server {
    listen 80 default_server;
    server_name _;

    # The ACME challenge must be answered over plain HTTP. A blanket redirect
    # to HTTPS would send certbot's renewal request to the TLS port and the
    # certificate would never renew — the site would break on the day the
    # certificate rolled over.
    location /.well-known/acme-challenge/ {
      root /var/www/html;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name brownhill.localhost;

    ssl_certificate     /etc/ssl/certs/server.crt;
    ssl_certificate_key /etc/ssl/private/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 25m;

    # The first-run bootstrap endpoint: the one path that creates an account.
    # Exact match, and rate limited hard.
    location = /api/v1/bootstrap {
      limit_req zone=bootstrap burst=5 nodelay;
      proxy_pass http://next:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    # The local first-run setup: reports whether an owner exists and creates
    # the very first account. Same treatment as bootstrap.
    location = /api/auth/local/setup {
      limit_req zone=bootstrap burst=5 nodelay;
      proxy_pass http://next:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    # The endpoints that take a credential. `/api/auth/local/me` and
    # `/api/auth/local/signout` are deliberately NOT limited: the client
    # calls `me` on every page load, and a limit here would throttle an
    # ordinary working session rather than a credential-guessing attempt.
    location = /api/auth/local/signin {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://next:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/local/otp/request {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://next:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/local/otp/verify {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://next:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/local/change-password {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://next:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    # Everything else.
    location / {
      proxy_pass http://next:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
