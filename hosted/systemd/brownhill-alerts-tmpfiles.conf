# /etc/tmpfiles.d/brownhill-alerts.conf
#
# The alert-marker directory lives under /run, which is a tmpfs and is empty
# after every reboot. The path unit cannot watch a directory that does not
# exist, and the nightly backup runs as the postgres account and cannot
# create one under /run either — /run itself belongs to root.
#
# systemd-tmpfiles creates it at every boot, owned by the account that writes
# the markers and group-readable by the accounts that read them.
d /run/brownhill/alerts 0775 postgres brownhill -
