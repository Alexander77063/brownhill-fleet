events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 30;

  # Rate-limit zones.
  #
  # `login` is for the endpoints that accept or check a credential.
  # `bootstrap` is for the endpoints that can create an account.
  #
  # Both zones used to sit on paths that this application does not serve:
  # `login` was on `/api/v1/auth/` and `bootstrap` was on
  # `/api/v1/postgrest/`. The auth routes are `/api/auth/local/*` and
  # `/api/v1/postgrest/` is not a route at all, so neither limit was ever
  # applied to anything — sign-in was unthrottled and the bootstrap limit
  # was spent on a path no request uses.
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=bootstrap:10m rate=5r/m;

  server {
    listen 80 default_server;
    server_name _;

    # The ACME challenge must be answered over plain HTTP. A blanket redirect
    # to HTTPS would send certbot's renewal request to the TLS port and the
    # certificate would never renew — the site would break on the day the
    # certificate rolled over.
    location /.well-known/acme-challenge/ {
      root /var/www/html;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # The placeholder. hosted/bootstrap/substitute-fqdn.sh replaces it with
    # the operator's real hostname — and the certificate paths below with it.
    server_name brownhill.example.co.uk;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_certificate /etc/letsencrypt/live/brownhill.example.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brownhill.example.co.uk/privkey.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 25m;

    # The first-run bootstrap endpoint: the one path that creates an account.
    # Exact match, and rate limited hard.
    location = /api/v1/bootstrap {
      limit_req zone=bootstrap burst=5 nodelay;
      proxy_pass http://127.0.0.1:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    # The local first-run setup: reports whether an owner exists and creates
    # the very first account. Same treatment as bootstrap.
    location = /api/auth/local/setup {
      limit_req zone=bootstrap burst=5 nodelay;
      proxy_pass http://127.0.0.1:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    # The endpoints that take a credential. `/api/auth/local/me` and
    # `/api/auth/local/signout` are deliberately NOT limited: the client
    # calls `me` on every page load, and a limit here would throttle an
    # ordinary working session rather than a credential-guessing attempt.
    location = /api/auth/local/signin {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://127.0.0.1:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/local/otp/request {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://127.0.0.1:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/local/otp/verify {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://127.0.0.1:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/local/change-password {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://127.0.0.1:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    # Everything else.
    location / {
      proxy_pass http://127.0.0.1:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
