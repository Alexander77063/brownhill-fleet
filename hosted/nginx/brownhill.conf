events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 30;

  # ── the access log ────────────────────────────────────────────────────────
  #
  # THE QUERY STRING IS NOT LOGGED
  #
  # The password reset link is `/reset-password?audience=...#token=...`. The
  # token rides in the FRAGMENT, which the browser does not send to the
  # server at all, so the request nginx answers carries no token in it — not
  # in the path, not in the query string.
  #
  # The query string is still not logged, and still must not be: it is where
  # a secret naturally ends up, and one already has — the signing token,
  # which lives in the PATH. nginx's built-in `combined` format logs
  # `$request` — the request line, query string and all — so a token good
  # for half an hour would sit in the log file for as long as the box kept
  # it, and anybody who could read the log could spend it.
  #
  # `$uri` is the path WITHOUT the query string, so the log still says what
  # was requested and never says what was asked with it. `$request_method`
  # is the method, not the request line, and is wanted.
  #
  # `$log_uri` is `$uri` with the signing token taken out of it — see the map
  # below. The signing token is a bearer secret that lives in the PATH
  # (`/sign/<token>`), so logging the path raw would put it in the log just
  # as the query string would have.
  log_format brownhill '$remote_addr - $remote_user [$time_local] "$request_method $log_uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

  # The signing token is in the path, so the path is replaced before it is
  # written. Every path under /sign/ and /api/sign/ carries one.
  map $uri $log_uri {
    ~^/api/sign/  "/api/sign/[token]";
    ~^/sign/      "/sign/[token]";
    default        $uri;
  }

  access_log /var/log/nginx/access.log brownhill;

  # Rate-limit zones.
  #
  # `login` is for the endpoints that accept or check a credential.
  # `bootstrap` is for the endpoints that can create an account.
  #
  # Both zones used to sit on paths that this application does not serve:
  # `login` was on `/api/v1/auth/` and `bootstrap` was on
  # `/api/v1/postgrest/`. The auth routes are `/api/auth/local/*` and
  # `/api/v1/postgrest/` is not a route at all, so neither limit was ever
  # applied to anything — sign-in was unthrottled and the bootstrap limit
  # was spent on a path no request uses.
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=bootstrap:10m rate=5r/m;

  server {
    listen 80 default_server;
    server_name _;

    # The ACME challenge must be answered over plain HTTP. A blanket redirect
    # to HTTPS would send certbot's renewal request to the TLS port and the
    # certificate would never renew — the site would break on the day the
    # certificate rolled over.
    location /.well-known/acme-challenge/ {
      root /var/www/html;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # The placeholder. hosted/bootstrap/substitute-fqdn.sh replaces it with
    # the operator's real hostname — and the certificate paths below with it.
    server_name brownhill.example.co.uk;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_certificate /etc/letsencrypt/live/brownhill.example.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brownhill.example.co.uk/privkey.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 25m;

    # The first-run bootstrap endpoint: the one path that creates an account.
    # Exact match, and rate limited hard.
    location = /api/v1/bootstrap {
      limit_req zone=bootstrap burst=5 nodelay;
      proxy_pass http://127.0.0.1:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }

    # The local first-run setup: reports whether an owner exists and creates
    # the very first account. Same treatment as bootstrap.
    location = /api/auth/local/setup {
      limit_req zone=bootstrap burst=5 nodelay;
      proxy_pass http://127.0.0.1:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }

    # The endpoints that take a credential. `/api/auth/local/me` and
    # `/api/auth/local/signout` are deliberately NOT limited: the client
    # calls `me` on every page load, and a limit here would throttle an
    # ordinary working session rather than a credential-guessing attempt.
    location = /api/auth/local/signin {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://127.0.0.1:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/local/otp/request {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://127.0.0.1:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/local/otp/verify {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://127.0.0.1:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/local/change-password {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://127.0.0.1:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }

    # The self-service password reset. Both endpoints are limited with the
    # login zone, for the same reason the sign-in endpoint is: they take
    # something that identifies an account, and the application throttle
    # behind them is a backstop rather than the limit.
    location = /api/auth/local/forgot-password {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://127.0.0.1:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/local/reset-password {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://127.0.0.1:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }

    # Everything else.
    location / {
      proxy_pass http://127.0.0.1:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
