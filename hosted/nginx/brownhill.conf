events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 30;

  # rate-limit zones (Task 8 will consume these)
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=bootstrap:10m rate=5r/m;

  server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    server_name brownhill.example.co.uk; # overridden by install

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_certificate /etc/letsencrypt/live/brownhill.example.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brownhill.example.co.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 25m;

    location /static/ {
      alias /var/lib/brownhill/static/;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location /api/v1/postgrest/ {
      limit_req zone=bootstrap burst=10 nodelay;  # bootstrap itself; auth tightened in Task 8
      proxy_pass http://127.0.0.1:55430/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/auth/ {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://127.0.0.1:55431;
    }

    location / {
      proxy_pass http://127.0.0.1:55431;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
